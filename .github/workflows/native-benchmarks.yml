name: Native Performance Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/**'
      - 'src/main.c'
      - 'src/compiler/**'
      - '.github/workflows/native-benchmarks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/**'
      - 'src/main.c'
      - 'src/compiler/**'
      - '.github/workflows/native-benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-native:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build VNT compiler
        shell: pwsh
        run: ./build.ps1
      - name: Verify and measure equivalent VNT, C, and Rust workloads
        shell: pwsh
        run: ./benchmarks/compare.ps1 -Runs 9 -Warmups 2
      - name: Verify unboxed-local correctness and overflow handling
        shell: bash
        run: |
          ./vnt --compile tests/native_integer_locals.vnt -o benchmarks/out/native_integer_locals.exe
          ./benchmarks/out/native_integer_locals.exe > benchmarks/out/native_integer_locals.txt
          printf '%s\\n' '-90' '-150' '-10' '5' > benchmarks/out/native_integer_locals.expected
          diff -u benchmarks/out/native_integer_locals.expected benchmarks/out/native_integer_locals.txt

          ./vnt --compile tests/native_integer_local_overflow.vnt -o benchmarks/out/native_integer_local_overflow.exe
          set +e
          ./benchmarks/out/native_integer_local_overflow.exe > benchmarks/out/native_integer_local_overflow.txt 2> benchmarks/out/native_integer_local_overflow.stderr
          overflow_status=$?
          set -e
          if [ "$overflow_status" -eq 0 ]; then
            echo "Unboxed signed 64-bit overflow incorrectly succeeded."
            exit 1
          fi
          grep -F "Runtime error: integer overflow in addition." benchmarks/out/native_integer_local_overflow.stderr

      - name: Publish benchmark CSV
        uses: actions/upload-artifact@v4
        with:
          name: vnt-native-benchmark-results
          path: benchmarks/out/comparison.csv
          if-no-files-found: error
