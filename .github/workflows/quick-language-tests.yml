          false
          false
          false
          false
          false
          false
          false
          false
          true
          false
          false
          false
          false
          true
          STDLIB_VALIDATE_OK
          VNT_EXPECTED
          diff -u std-validate-expected.txt std-validate-actual-lf.txt

      - name: Run number standard-library regressions
        shell: bash
        run: |
          ./vnt --compile tests/std_number.vnt -o std-number-smoke.exe
          ./std-number-smoke.exe > std-number-actual.txt
          tr -d '\r' < std-number-actual.txt > std-number-actual-lf.txt
          cat > std-number-expected.txt <<'VNT_EXPECTED'
          4
          -9
          9
          -4
          5
          0
          10
          5
          true
          true
          false
          true
          true
          true
          true
          true
          -1
          0
          1
          1
          120
          -1
          2432902008176640000
          -1
          2
          -1
          1
          1
          6
          6
          0
          false
          false
          false
          true
          true
          false
          true
          false
