name: VNT Quick Language Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'freestanding/**'
      - 'include/**'
      - 'tests/*.vnt'
      - 'tests/**/*.py'
      - 'lib/std/**'
      - 'examples/**'
      - 'docs/tutorials/**'
      - '.github/workflows/quick-language-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/*.vnt'
      - 'tests/**/*.py'
      - 'lib/std/**'
      - 'examples/**'
      - 'docs/tutorials/**'
      - '.github/workflows/quick-language-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-language-tests:
    name: Build and run VNT smoke tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-python

      - name: Install compiler toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc libssl-dev python3

      - name: Build VNT compiler
        shell: bash
        run: |
          gcc -O2 -Iinclude -Isrc/compiler \
            src/main.c \
            src/modules.c \
            src/lexer.c \
            src/parser/parser.c \
            src/parser/primary.c \
            src/parser/unary.c \
            src/parser/binary.c \
            src/parser/functions.c \
            src/parser/statements.c \
            src/parser/simple_statements.c \
            src/parser/control.c \
            src/parser/loops.c \
            src/parser/assignments.c \
            src/ast.c \
            src/compiler/compiler.c \
            src/compiler/typecheck.c \
            src/compiler/ir.c \
            src/compiler/ir_lower.c \
            src/compiler/cfg.c \
            src/compiler/x86_backend.c \
            src/compiler/freestanding_x86.c \
            -o vnt

      - name: Emit assembly without invoking the hosted linker
        shell: bash
        run: |
          ./vnt --emit-asm examples/global_variables.vnt -o vnt-assembly-only.s
          test -s vnt-assembly-only.s
          grep -F '.globl main' vnt-assembly-only.s

      - name: Build freestanding x86-64 ELF without hosted runtime (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./vnt --build-freestanding tests/freestanding_minimal.vnt -o freestanding-kernel.elf
          test -z "$(nm -u freestanding-kernel.elf)"
          readelf -h freestanding-kernel.elf | grep -F 'ELF64'
          readelf -h freestanding-kernel.elf | grep -F 'Entry point address'
          readelf -l freestanding-kernel.elf | grep -F 'LOAD'
          if ./vnt --emit-freestanding-asm tests/freestanding_hosted_rejected.vnt -o freestanding-invalid.s; then
            echo "Freestanding backend incorrectly accepted a hosted print operation."
            exit 1
          fi
          test ! -e freestanding-invalid.s

      - name: Compile raw memory regression program
        shell: bash
        run: ./vnt --compile tests/unsafe_memory.vnt -o vnt-memory-smoke.exe

      - name: Run raw memory regression program
        shell: bash
        run: |
          ./vnt-memory-smoke.exe > vnt-memory-actual.txt
          tr -d '\r' < vnt-memory-actual.txt > vnt-memory-actual-lf.txt
          printf '305419896\n305419896\n255\n42\nRAW_MEMORY_OK\n' > vnt-memory-expected.txt
          diff -u vnt-memory-expected.txt vnt-memory-actual-lf.txt

      - name: Reject pointer arithmetic on a null pointer
        shell: bash
        run: |
          ./vnt --compile tests/unsafe_null_offset_rejected.vnt -o vnt-null-offset.exe
          if ./vnt-null-offset.exe > vnt-null-offset-output.txt 2>&1; then
            echo "Compiler runtime incorrectly accepted pointer arithmetic on null."
            exit 1
          fi
          grep -F "Runtime error: invalid pointer offset." vnt-null-offset-output.txt

      - name: Compile unsafe-block regression program
        shell: bash
        run: ./vnt --compile tests/unsafe_block.vnt -o vnt-unsafe-smoke.exe

      - name: Run unsafe-block regression program
        shell: bash
        run: |
          ./vnt-unsafe-smoke.exe > vnt-unsafe-actual.txt
          tr -d '\r' < vnt-unsafe-actual.txt > vnt-unsafe-actual-lf.txt
          printf '123456789\nUNSAFE_BLOCK_OK\n' > vnt-unsafe-expected.txt
          diff -u vnt-unsafe-expected.txt vnt-unsafe-actual-lf.txt

      - name: Reject raw memory outside unsafe
        shell: bash
        run: |
          if ./vnt --compile tests/unsafe_context_rejected.vnt -o vnt-unsafe-invalid.exe; then
            echo "Compiler incorrectly accepted raw memory outside unsafe."
            exit 1
          fi

      - name: Reject unsafe library call outside unsafe
        shell: bash
        run: |
          if ./vnt --compile tests/unsafe_function_rejected.vnt -o vnt-unsafe-function-invalid.exe; then
            echo "Compiler incorrectly accepted an unsafe function call outside unsafe."
            exit 1
          fi

      - name: Reject inline assembly outside unsafe
        shell: bash
        run: |
          if ./vnt --compile tests/asm_context_rejected.vnt -o vnt-asm-invalid.exe; then
            echo "Compiler incorrectly accepted inline assembly outside unsafe."
            exit 1
          fi

      - name: Compile complete task tracker example
        shell: bash
        run: ./vnt --compile examples/task_tracker.vnt -o vnt-task-tracker-smoke.exe

      - name: Compile VNT regression programs
        shell: bash
        run: |
          ./vnt --compile tests/native_compiler.vnt -o vnt-native-smoke.exe
          ./vnt --compile tests/hir_constant_folding.vnt -o vnt-hir-smoke.exe

      - name: Run native networking integration tests
        shell: bash
        run: python3 tests/run_native_networking.py

      - name: Run native programs and verify output
        shell: bash
        run: |
          ./vnt-native-smoke.exe > vnt-native-actual.txt
          tr -d '\r' < vnt-native-actual.txt > vnt-native-actual-lf.txt
          printf 'IR:\n14\ntrue\ntrue\nNative compiler OK\n' > vnt-native-expected.txt
          diff -u vnt-native-expected.txt vnt-native-actual-lf.txt

          ./vnt-hir-smoke.exe > vnt-hir-actual.txt
          tr -d '\r' < vnt-hir-actual.txt > vnt-hir-actual-lf.txt
          printf '14\n4\nfalse\n3.75\n10\n3\ntrue\nHIR_CONSTANT_FOLDING_OK\n' > vnt-hir-expected.txt
          diff -u vnt-hir-expected.txt vnt-hir-actual-lf.txt
