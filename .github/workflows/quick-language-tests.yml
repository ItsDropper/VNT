name: VNT Quick Language Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'freestanding/**'
      - 'os/**'
      - 'include/**'
      - 'tests/*.vnt'
      - 'tests/**/*.py'
      - 'lib/std/**'
      - 'examples/**'
      - 'docs/tutorials/**'
      - '.github/workflows/quick-language-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'freestanding/**'
      - 'include/**'
      - 'tests/*.vnt'
      - 'tests/**/*.py'
      - 'lib/std/**'
      - 'examples/**'
      - 'docs/tutorials/**'
      - '.github/workflows/quick-language-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quick-language-tests:
    name: Build and run VNT smoke tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-python

      - name: Install compiler toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc libssl-dev python3 grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Build VNT compiler
        shell: bash
        run: |
          gcc -O2 -Iinclude -Isrc/compiler \
            src/main.c \
            src/modules.c \
            src/lexer.c \
            src/parser/parser.c \
            src/parser/primary.c \
            src/parser/unary.c \
            src/parser/binary.c \
            src/parser/functions.c \
            src/parser/statements.c \
            src/parser/simple_statements.c \
            src/parser/control.c \
            src/parser/loops.c \
            src/parser/assignments.c \
            src/ast.c \
            src/compiler/compiler.c \
            src/compiler/typecheck.c \
            src/compiler/ir.c \
            src/compiler/ir_lower.c \
            src/compiler/cfg.c \
            src/compiler/x86_backend.c \
            src/compiler/freestanding_x86.c \
            -o vnt

      - name: Build and run HIR/CFG invariant tests
        shell: bash
        run: |
          gcc -O2 -Wall -Wextra -Iinclude \
            tests/hir_invariants.c src/ast.c src/compiler/ir.c \
            src/compiler/ir_lower.c src/compiler/cfg.c \
            -o hir-invariants
          ./hir-invariants

      - name: Run loop-control regression programs
        shell: bash
        run: |
          ./vnt --compile tests/loops.vnt -o vnt-loops-smoke.exe
          ./vnt-loops-smoke.exe > vnt-loops-actual.txt
          tr -d '\r' < vnt-loops-actual.txt > vnt-loops-actual-lf.txt
          cat > vnt-loops-expected.txt <<'VNT_EXPECTED'
          break
          1
          2
          3
          4
          continue
          1
          2
          4
          5
          while
          1
          3
          4
          VNT_EXPECTED
          diff -u vnt-loops-expected.txt vnt-loops-actual-lf.txt

          ./vnt --compile tests/nested_loop_control.vnt -o vnt-nested-loops-smoke.exe
          ./vnt-nested-loops-smoke.exe > vnt-nested-loops-actual.txt
          tr -d '\r' < vnt-nested-loops-actual.txt > vnt-nested-loops-actual-lf.txt
          cat > vnt-nested-loops-expected.txt <<'VNT_EXPECTED'
          nested
          1
          1
          3
          2
          1
          3
          3
          1
          3
          VNT_EXPECTED
          diff -u vnt-nested-loops-expected.txt vnt-nested-loops-actual-lf.txt

      - name: Verify JSON field accessor edge cases
        shell: bash
        run: |
          ./vnt --compile tests/json_value_at.vnt -o vnt-json-value-at.exe
          ./vnt-json-value-at.exe > vnt-json-value-at-actual.txt
          tr -d '\r' < vnt-json-value-at-actual.txt > vnt-json-value-at-actual-lf.txt
          printf 'Sodium\nlithium\n100\nescaped-key\nC:\\VNT/bin\nfalse\nfalse\n\n4\n2500\nJSON_VALUE_AT_OK\n' > vnt-json-value-at-expected.txt
          diff -u vnt-json-value-at-expected.txt vnt-json-value-at-actual-lf.txt

      - name: Verify native object field growth and replacement
        shell: bash
        run: |
          ./vnt --compile tests/object_growth.vnt -o vnt-object-growth.exe
          ./vnt-object-growth.exe > vnt-object-growth-actual.txt
          tr -d '\r' < vnt-object-growth-actual.txt > vnt-object-growth-actual-lf.txt
          printf '101\n5\n9\n12\nnull\nOBJECT_GROWTH_OK\n' > vnt-object-growth-expected.txt
          diff -u vnt-object-growth-expected.txt vnt-object-growth-actual-lf.txt

      - name: Reject invalid expressions and incomplete return paths
        shell: bash
        run: |
          if ./vnt --compile tests/typecheck_duplicate_struct_fields.vnt -o duplicate-struct-fields-invalid.exe; then
            echo "Compiler incorrectly accepted duplicate struct field names."
            exit 1
          fi
          test ! -e duplicate-struct-fields-invalid.exe
          if ./vnt --compile tests/typecheck_duplicate_struct_definitions.vnt -o duplicate-struct-definitions-invalid.exe; then
            echo "Compiler incorrectly accepted duplicate struct definitions."
            exit 1
          fi
          test ! -e duplicate-struct-definitions-invalid.exe
          if ./vnt --compile tests/typecheck_duplicate_function_definitions.vnt -o duplicate-function-definitions-invalid.exe; then
            echo "Compiler incorrectly accepted duplicate function definitions."
            exit 1
          fi
          test ! -e duplicate-function-definitions-invalid.exe
          if ./vnt --compile tests/typecheck_void_value_rejected.vnt -o void-value-invalid.exe; then
            echo "Compiler incorrectly accepted a void-returning call as a variable initializer."
            exit 1
          fi
          test ! -e void-value-invalid.exe
          if ./vnt --compile tests/typecheck_void_print_rejected.vnt -o void-print-invalid.exe; then
            echo "Compiler incorrectly accepted a void-returning call as a printed value."
            exit 1
          fi
          test ! -e void-print-invalid.exe
          if ./vnt --compile tests/typecheck_void_assignment_rejected.vnt -o void-assignment-invalid.exe; then
            echo "Compiler incorrectly accepted a void-returning call as an assignment value."
            exit 1
          fi
          test ! -e void-assignment-invalid.exe
          if ./vnt --compile tests/typecheck_void_nested_expression_rejected.vnt -o void-nested-invalid.exe; then
            echo "Compiler incorrectly accepted void-returning calls inside a binary expression."
            exit 1
          fi
          test ! -e void-nested-invalid.exe
          if ./vnt --compile tests/typecheck_void_unary_expression_rejected.vnt -o void-unary-invalid.exe; then
            echo "Compiler incorrectly accepted a void-returning call in a unary expression."
            exit 1
          fi
          test ! -e void-unary-invalid.exe
          if ./vnt --compile tests/typecheck_void_condition_rejected.vnt -o void-condition-invalid.exe 2> void-condition-invalid.exe.log; then
            echo "Compiler incorrectly accepted a void-returning call as an if condition."
            exit 1
          fi
          test ! -e void-condition-invalid.exe
          grep -F "void function call cannot be used as a control-flow condition." void-condition-invalid.exe.log
          if ./vnt --compile tests/typecheck_void_while_condition_rejected.vnt -o void-while-invalid.exe 2> void-while-invalid.exe.log; then
            echo "Compiler incorrectly accepted a void-returning call as a while condition."
            exit 1
          fi
          test ! -e void-while-invalid.exe
          grep -F "void function call cannot be used as a control-flow condition." void-while-invalid.exe.log
          if ./vnt --compile tests/typecheck_bare_return_nonvoid_rejected.vnt -o bare-return-nonvoid-invalid.exe 2> bare-return-nonvoid-diagnostic.log; then
            echo "Compiler incorrectly accepted a bare return in a non-void function."
            exit 1
          fi
          grep -F "non-void function must return a value." bare-return-nonvoid-diagnostic.log
          test ! -e bare-return-nonvoid-invalid.exe
          if ./vnt --compile tests/typecheck_void_array_element_rejected.vnt -o void-array-invalid.exe; then
            echo "Compiler incorrectly accepted a void-returning call as an array element."
            exit 1
          fi
          test ! -e void-array-invalid.exe
          if ./vnt --compile tests/typecheck_void_argument_rejected.vnt -o void-argument-invalid.exe; then
            echo "Compiler incorrectly accepted a void-returning call as a function argument."
            exit 1
          fi
          test ! -e void-argument-invalid.exe
          if ./vnt --compile tests/typecheck_struct_constructor_arguments_rejected.vnt -o struct-arguments-invalid.exe; then
            echo "Compiler incorrectly accepted arguments for a zero-argument struct constructor."
            exit 1
          fi
          test ! -e struct-arguments-invalid.exe
          if ./vnt --compile tests/typed_function_loop_only_return.vnt -o loop-return-invalid.exe; then
            echo "Compiler incorrectly assumed a while loop executes and satisfies a typed function return."
            exit 1
          fi
          test ! -e loop-return-invalid.exe
          if ./vnt --compile tests/typed_function_nested_partial_return.vnt -o nested-partial-return-invalid.exe 2> nested-partial-return-diagnostic.log; then
            echo "Compiler incorrectly accepted a typed function whose nested conditional can fall through."
            exit 1
          fi
          grep -F "typed function 'maybe_returns' returning int does not return a value on every path." nested-partial-return-diagnostic.log
          test ! -e nested-partial-return-invalid.exe
          if ./vnt --compile tests/typed_function_unsafe_partial_return.vnt -o unsafe-partial-return-invalid.exe 2> unsafe-partial-return-diagnostic.log; then
            echo "Compiler incorrectly accepted a typed function whose unsafe block can fall through."
            exit 1
          fi
          grep -F "typed function 'maybe_returns' returning int does not return a value on every path." unsafe-partial-return-diagnostic.log
          test ! -e unsafe-partial-return-invalid.exe
          ./vnt --compile tests/typed_function_nested_returns.vnt -o nested-typed-returns.exe
          ./nested-typed-returns.exe > nested-typed-returns-actual.txt
          tr -d '\r' < nested-typed-returns-actual.txt > nested-typed-returns-actual-lf.txt
          cat > nested-typed-returns-expected.txt <<'VNT_EXPECTED'
          7
          9
          NESTED_TYPED_RETURNS_OK
          VNT_EXPECTED
          diff -u nested-typed-returns-expected.txt nested-typed-returns-actual-lf.txt

          ./vnt --compile tests/typed_function_fallthrough_return.vnt -o typed-fallthrough-return.exe
          ./typed-fallthrough-return.exe > typed-fallthrough-return-actual.txt
          tr -d '\r' < typed-fallthrough-return-actual.txt > typed-fallthrough-return-actual-lf.txt
          printf '17\n23\nTYPED_FALLTHROUGH_RETURN_OK\n' > typed-fallthrough-return-expected.txt
          diff -u typed-fallthrough-return-expected.txt typed-fallthrough-return-actual-lf.txt

          ./vnt --compile tests/typed_function_nested_fallthrough_return.vnt -o typed-nested-fallthrough.exe
          ./typed-nested-fallthrough.exe > typed-nested-fallthrough-actual.txt
          tr -d '\r' < typed-nested-fallthrough-actual.txt > typed-nested-fallthrough-actual-lf.txt
          printf '31\n47\n47\nTYPED_NESTED_FALLTHROUGH_OK\n' > typed-nested-fallthrough-expected.txt
          diff -u typed-nested-fallthrough-expected.txt typed-nested-fallthrough-actual-lf.txt

          ./vnt --compile tests/typed_function_unsafe_return.vnt -o typed-unsafe-return.exe
          ./typed-unsafe-return.exe > typed-unsafe-return-actual.txt
          tr -d '\r' < typed-unsafe-return-actual.txt > typed-unsafe-return-actual-lf.txt
          printf '53\nTYPED_UNSAFE_RETURN_OK\n' > typed-unsafe-return-expected.txt
          diff -u typed-unsafe-return-expected.txt typed-unsafe-return-actual-lf.txt

          ./vnt --compile tests/typed_function_unsafe_branch_returns.vnt -o typed-unsafe-branches.exe
          ./typed-unsafe-branches.exe > typed-unsafe-branches-actual.txt
          tr -d '\r' < typed-unsafe-branches-actual.txt > typed-unsafe-branches-actual-lf.txt
          printf '67\n68\nTYPED_UNSAFE_BRANCH_RETURNS_OK\n' > typed-unsafe-branches-expected.txt
          diff -u typed-unsafe-branches-expected.txt typed-unsafe-branches-actual-lf.txt

          ./vnt --compile tests/void_bare_return.vnt -o void-bare-return.exe
          ./void-bare-return.exe > void-bare-return-actual.txt
          tr -d '\r' < void-bare-return-actual.txt > void-bare-return-actual-lf.txt
          printf 'FALLTHROUGH\nVOID_BARE_RETURN_OK\n' > void-bare-return-expected.txt
          diff -u void-bare-return-expected.txt void-bare-return-actual-lf.txt
          if ./vnt --compile tests/typecheck_break_outside_loop.vnt -o break-outside-loop-invalid.exe; then
            echo "Compiler incorrectly accepted break outside a loop."
            exit 1
          fi
          test ! -e break-outside-loop-invalid.exe
          if ./vnt --compile tests/typecheck_continue_outside_loop.vnt -o continue-outside-loop-invalid.exe; then
            echo "Compiler incorrectly accepted continue outside a loop."
            exit 1
          fi
          test ! -e continue-outside-loop-invalid.exe
          for case in \
            tests/typecheck_break_in_function_rejected.vnt \
            tests/typecheck_continue_in_function_rejected.vnt \
            tests/typecheck_break_in_conditional_rejected.vnt \
            tests/typecheck_unknown_return_type.vnt \
            tests/typecheck_void_parameter_type.vnt \
            tests/typecheck_unknown_parameter_type.vnt \
            tests/typecheck_duplicate_parameter_names.vnt \
            tests/typecheck_nested_function_cannot_break_caller_loop.vnt \
            tests/typecheck_invalid_equality.vnt \
            tests/typecheck_invalid_ordered_comparison.vnt \
            tests/typecheck_invalid_boolean_order.vnt \
            tests/typecheck_scope_if_leak.vnt \
            tests/typecheck_scope_while_leak.vnt \
            tests/typecheck_read_before_assignment.vnt \
            tests/typecheck_shadow_same_scope.vnt \
            tests/typecheck_invalid_void_return.vnt; do
            output="semantic-context-invalid.exe"
            if ./vnt --compile "$case" -o "$output"; then
              echo "Compiler incorrectly accepted invalid semantic context in $case."
              exit 1
            fi
            test ! -e "$output"
          done
          for case in \
            tests/typecheck_argument_type_mismatch.vnt \
            tests/typecheck_return_type_mismatch.vnt \
            tests/typecheck_explicit_assignment_type_mismatch.vnt \
            tests/typecheck_initializer_type_mismatch.vnt; do
            output="type-mismatch-invalid.exe"
            if ./vnt --compile "$case" -o "$output"; then
              echo "Compiler incorrectly accepted incompatible typed value in $case."
              exit 1
            fi
            test ! -e "$output"
          done
          for case in \
            tests/typecheck_function_arity_mismatch.vnt \
            tests/typecheck_function_too_many_arguments.vnt \
            tests/typecheck_builtin_arity_mismatch.vnt \
            tests/typecheck_builtin_too_few_arguments.vnt \
            tests/typecheck_undeclared_function.vnt; do
            output="arity-mismatch-invalid.exe"
            if ./vnt --compile "$case" -o "$output"; then
              echo "Compiler incorrectly accepted invalid argument count in $case."
              exit 1
            fi
            test ! -e "$output"
          done

          if ./vnt --compile tests/typecheck_function_too_many_arguments.vnt -o call-arity-invalid.exe 2> call-arity-diagnostic.log; then
            echo "Compiler incorrectly accepted a call with too many arguments."
            exit 1
          fi
          grep -F "function 'add' expects 2 arguments but received 3." call-arity-diagnostic.log
          test ! -e call-arity-invalid.exe
          if ./vnt --compile tests/typecheck_builtin_arity_mismatch.vnt -o builtin-arity-invalid.exe 2> builtin-arity-diagnostic.log; then
            echo "Compiler incorrectly accepted a builtin call with too many arguments."
            exit 1
          fi
          grep -F "builtin 'len' does not accept 2 arguments." builtin-arity-diagnostic.log
          test ! -e builtin-arity-invalid.exe
          if ./vnt --compile tests/typecheck_struct_constructor_arguments_rejected.vnt -o struct-arity-invalid.exe 2> struct-arity-diagnostic.log; then
            echo "Compiler incorrectly accepted arguments to a zero-argument struct constructor."
            exit 1
          fi
          grep -F "struct constructor 'Point' currently takes no arguments." struct-arity-diagnostic.log
          test ! -e struct-arity-invalid.exe
          if ./vnt --compile tests/typecheck_argument_type_mismatch.vnt -o argument-type-invalid.exe 2> argument-type-diagnostic.log; then
            echo "Compiler incorrectly accepted a function argument with an incompatible type."
            exit 1
          fi
          grep -F "argument 1 ('value') to function 'requires_integer' expects int but received string." argument-type-diagnostic.log
          test ! -e argument-type-invalid.exe
          if ./vnt --compile tests/typecheck_return_type_mismatch.vnt -o return-type-invalid.exe 2> return-type-diagnostic.log; then
            echo "Compiler incorrectly accepted an incompatible function return value."
            exit 1
          fi
          grep -F "function return type mismatch: expected int but returned string." return-type-diagnostic.log
          test ! -e return-type-invalid.exe
          if ./vnt --compile tests/typecheck_initializer_type_mismatch.vnt -o initializer-type-invalid.exe 2> initializer-type-diagnostic.log; then
            echo "Compiler incorrectly accepted an incompatible explicit initializer."
            exit 1
          fi
          grep -F "initializer for 'count' expects int but received string." initializer-type-diagnostic.log
          test ! -e initializer-type-invalid.exe
          if ./vnt --compile tests/typecheck_explicit_assignment_type_mismatch.vnt -o assignment-type-invalid.exe 2> assignment-type-diagnostic.log; then
            echo "Compiler incorrectly accepted an incompatible explicit assignment."
            exit 1
          fi
          grep -F "assignment target has type int but assigned value has type string." assignment-type-diagnostic.log
          test ! -e assignment-type-invalid.exe
          if ./vnt --compile tests/typecheck_parameter_assignment_type_mismatch.vnt -o parameter-assignment-type-invalid.exe 2> parameter-assignment-type-diagnostic.log; then
            echo "Compiler incorrectly accepted an incompatible assignment to an explicitly typed parameter."
            exit 1
          fi
          grep -F "assignment target has type int but assigned value has type string." parameter-assignment-type-diagnostic.log
          test ! -e parameter-assignment-type-invalid.exe

          ./vnt --compile tests/typecheck_explicit_assignment_numeric_compatible.vnt -o typed-numeric-reassignment.exe
          ./typed-numeric-reassignment.exe > typed-numeric-reassignment-actual.txt
          tr -d '\r' < typed-numeric-reassignment-actual.txt > typed-numeric-reassignment-actual-lf.txt
          printf '11\nTYPED_NUMERIC_REASSIGNMENT_OK\n' > typed-numeric-reassignment-expected.txt
          tr -d '\r' < typed-numeric-reassignment-expected.txt > typed-numeric-reassignment-expected-lf.txt
          diff -u typed-numeric-reassignment-expected-lf.txt typed-numeric-reassignment-actual-lf.txt

          ./vnt --compile tests/typecheck_all_numeric_reassignment_compatible.vnt -o all-numeric-reassignment.exe
          ./all-numeric-reassignment.exe > all-numeric-reassignment-actual.txt
          printf 'ALL_NUMERIC_REASSIGNMENT_COMPATIBLE_OK\n' > all-numeric-reassignment-expected.txt
          tr -d '\r' < all-numeric-reassignment-actual.txt > all-numeric-reassignment-actual-lf.txt
          tr -d '\r' < all-numeric-reassignment-expected.txt > all-numeric-reassignment-expected-lf.txt
          diff -u all-numeric-reassignment-expected-lf.txt all-numeric-reassignment-actual-lf.txt

      - name: Run pure VNT statistics and validation library regressions
        shell: bash
        run: |
          ./vnt --compile tests/std_statistics.vnt -o std-statistics-smoke.exe
          ./std-statistics-smoke.exe > std-statistics-actual.txt
          tr -d '\r' < std-statistics-actual.txt > std-statistics-actual-lf.txt
          cat > std-statistics-expected.txt <<'VNT_EXPECTED'
          4.5
          4
          1.5
          -0.5
          1
          1
          9
          8
          8.75
          0
          1
          2.5
          4
          9
          1
          9
          [1, 3, 5, 9]
          [9, 1, 5, 3]
          0
          0
          0
          STDLIB_STATISTICS_OK
          VNT_EXPECTED
          diff -u std-statistics-expected.txt std-statistics-actual-lf.txt

          ./vnt --compile tests/std_validate.vnt -o std-validate-smoke.exe
          ./std-validate-smoke.exe > std-validate-actual.txt
          tr -d '\r' < std-validate-actual.txt > std-validate-actual-lf.txt
          cat > std-validate-expected.txt <<'VNT_EXPECTED'
          true
          true
          false
          true
          false
          true
          false
          true
