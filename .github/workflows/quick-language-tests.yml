          true
          false
          true
          true
          true
          true
          true
          false
          false
          false
          NUMBER_STANDARD_LIBRARY_OK
          VNT_EXPECTED
          diff -u std-number-expected.txt std-number-actual-lf.txt

      - name: Run array standard-library regressions
        shell: bash
        run: |
          ./vnt --compile tests/std_array.vnt -o std-array-smoke.exe
          ./std-array-smoke.exe > std-array-actual.txt
          tr -d '\r' < std-array-actual.txt > std-array-actual-lf.txt
          cat > std-array-expected.txt <<'VNT_EXPECTED'
          true
          1
          2
          6
          1.5
          0
          -3
          5
          3
          3
          2
          2
          2
          b
          a-b-c
          0
          2
          y
          0
          0
          ARRAY_STANDARD_LIBRARY_OK
          VNT_EXPECTED
          diff -u std-array-expected.txt std-array-actual-lf.txt

      - name: Run string standard-library regressions
        shell: bash
        run: |
          ./vnt --compile tests/std_string.vnt -o std-string-smoke.exe
          ./std-string-smoke.exe > std-string-actual.txt
          tr -d '\r' < std-string-actual.txt > std-string-actual-lf.txt
          cat > std-string-expected.txt <<'VNT_EXPECTED'
          true
          true
          true
          false
          true
          2
          4
          true
          2
          ababab
          1 two 1
          value
          4
          a
          0
          b
