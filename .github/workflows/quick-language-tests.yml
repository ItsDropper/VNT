          one
          two
          0
          STRING_STANDARD_LIBRARY_OK
          VNT_EXPECTED
          diff -u std-string-expected.txt std-string-actual-lf.txt

      - name: Run CSV parser and serializer regressions
        shell: bash
        run: |
