name: VNT Quick Language Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/*.vnt'
      - 'tests/**/*.py'
      - 'lib/std/**'
      - 'examples/**'
      - 'docs/tutorials/**'
      - '.github/workflows/quick-language-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/*.vnt'
      - 'tests/**/*.py'
      - 'lib/std/**'
      - 'examples/**'
      - 'docs/tutorials/**'
      - '.github/workflows/quick-language-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-language-tests:
    name: Build and run VNT smoke tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-python

      - name: Install compiler toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc libssl-dev python3

      - name: Build VNT compiler
        shell: bash
        run: |
          gcc -O2 -Iinclude -Isrc/compiler \
            src/main.c \
            src/modules.c \
            src/lexer.c \
            src/parser/parser.c \
            src/parser/primary.c \
            src/parser/unary.c \
            src/parser/binary.c \
            src/parser/functions.c \
            src/parser/statements.c \
            src/parser/simple_statements.c \
            src/parser/control.c \
            src/parser/loops.c \
            src/parser/assignments.c \
            src/ast.c \
            src/compiler/compiler.c \
            src/compiler/typecheck.c \
            src/compiler/ir.c \
            src/compiler/ir_lower.c \
            src/compiler/cfg.c \
            src/compiler/x86_backend.c \
            -o vnt

      - name: Compile VNT regression programs
        shell: bash
        run: |
          ./vnt --compile tests/native_compiler.vnt -o vnt-native-smoke.exe
          ./vnt --compile tests/hir_constant_folding.vnt -o vnt-hir-smoke.exe

      - name: Run native networking integration tests
        shell: bash
        run: python3 tests/run_native_networking.py

      - name: Run native programs and verify output
        shell: bash
        run: |
          ./vnt-native-smoke.exe > vnt-native-actual.txt
          tr -d '\r' < vnt-native-actual.txt > vnt-native-actual-lf.txt
          printf 'IR:\n14\ntrue\ntrue\nNative compiler OK\n' > vnt-native-expected.txt
          diff -u vnt-native-expected.txt vnt-native-actual-lf.txt

          ./vnt-hir-smoke.exe > vnt-hir-actual.txt
          tr -d '\r' < vnt-hir-actual.txt > vnt-hir-actual-lf.txt
          printf '14\n4\nfalse\n3.75\n10\n3\ntrue\nHIR_CONSTANT_FOLDING_OK\n' > vnt-hir-expected.txt
          diff -u vnt-hir-expected.txt vnt-hir-actual-lf.txt
