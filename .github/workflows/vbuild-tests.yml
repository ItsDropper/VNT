name: VBuild Tests

on:
  push:
    branches: [main]
    paths:
      - 'tools/vbuild.py'
      - 'tests/test_vbuild.py'
      - 'docs/VBUILD.md'
      - '.github/workflows/vbuild-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/vbuild.py'
      - 'tests/test_vbuild.py'
      - 'docs/VBUILD.md'
      - '.github/workflows/vbuild-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vbuild-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vbuild-unit-tests:
    name: VBuild unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build native VBuild executable
        run: gcc -std=c11 -O2 tools/vbuild.c -o vbuild${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Verify VBuild CLI and initialization
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vbuild smoke project"
          cd "$RUNNER_TEMP/vbuild smoke project"
          "$GITHUB_WORKSPACE/vbuild${{ runner.os == 'Windows' && '.exe' || '' }}" init
          test -f build.vbuild
          test -f vbuild.properties
          test -f src/main.vnt
          "$GITHUB_WORKSPACE/vbuild${{ runner.os == 'Windows' && '.exe' || '' }}" clean --help >/dev/null 2>&1 && exit 1 || true
