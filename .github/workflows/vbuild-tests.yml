name: VBuild Tests

on:
  push:
    branches: [main]
    paths:
      - 'tools/vbuild.c'
      - 'docs/VBUILD.md'
      - '.github/workflows/vbuild-tests.yml'
      - 'src/**'
      - 'include/**'
      - 'build.ps1'
  pull_request:
    branches: [main]
    paths:
      - 'tools/vbuild.c'
      - 'docs/VBUILD.md'
      - '.github/workflows/vbuild-tests.yml'
      - 'src/**'
      - 'include/**'
      - 'build.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vbuild-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vbuild-native:
    name: Native VBuild (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile native VBuild
        shell: pwsh
        run: |
          if ($IsWindows) {
            gcc -std=c11 -Wall -Wextra -Werror -O2 tools/vbuild.c -o vbuild.exe
          } else {
            gcc -std=c11 -Wall -Wextra -Werror -O2 tools/vbuild.c -o vbuild
          }
          if ($LASTEXITCODE -ne 0) { throw 'Native VBuild compilation failed' }
      - name: Smoke-test project lifecycle and task parsing
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'vbuild.exe' } else { 'vbuild' }
          $binary = Join-Path $env:GITHUB_WORKSPACE $binaryName
          $project = Join-Path $env:RUNNER_TEMP 'vbuild smoke project'
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          Push-Location $project
          try {
            & $binary init
            if ($LASTEXITCODE -ne 0) { throw 'vbuild init failed' }
            foreach ($path in @('build.vbuild', 'vbuild.properties', 'src/main.vnt')) {
              if (-not (Test-Path $path)) { throw "init did not create $path" }
            }
            $validProperties = Get-Content -Raw vbuild.properties
            if ($IsWindows) {
              $driveRelativeProperties = $validProperties -replace '(?m)^toolchain = .+$','toolchain = C:relative-toolchain'
              Set-Content -NoNewline -Path vbuild.properties -Value $driveRelativeProperties
              $driveRelativeOutput = & $binary check 2>&1
              $driveRelativeExitCode = $LASTEXITCODE
              if ($driveRelativeExitCode -eq 0 -or ($driveRelativeOutput -join "`n") -notmatch 'drive-relative paths are ambiguous') {
                throw "ambiguous Windows drive-relative toolchain paths were not rejected: $($driveRelativeOutput -join ' | ')"
              }
              Set-Content -NoNewline -Path vbuild.properties -Value $validProperties
            }
            Add-Content vbuild.properties 'source = src/duplicate.vnt'
            $duplicatePropertyOutput = & $binary build 2>&1
            $duplicatePropertyExitCode = $LASTEXITCODE
            if ($duplicatePropertyExitCode -eq 0 -or ($duplicatePropertyOutput -join "`n") -notmatch "duplicate property 'source'") {
              throw "duplicate project properties were not rejected with a targeted diagnostic: $($duplicatePropertyOutput -join ' | ')"
            }
            Set-Content -NoNewline -Path vbuild.properties -Value $validProperties
            Add-Content vbuild.properties 'project.version = "unterminated'
            $malformedPropertyOutput = & $binary build 2>&1
            $malformedPropertyExitCode = $LASTEXITCODE
            if ($malformedPropertyExitCode -eq 0 -or ($malformedPropertyOutput -join "`n") -notmatch "unterminated quoted value for property 'project.version'") {
              throw "malformed quoted properties were not rejected with a targeted diagnostic: $($malformedPropertyOutput -join ' | ')"
            }
            Set-Content -NoNewline -Path vbuild.properties -Value $validProperties
            Add-Content build.vbuild 'task verify = none depends check, build'
            & $binary tasks
            if ($LASTEXITCODE -ne 0) { throw 'task graph parsing failed' }
            $validBuild = Get-Content -Raw build.vbuild
            Add-Content build.vbuild 'target elf'
            & $binary tasks
            if ($LASTEXITCODE -eq 0) { throw 'duplicate target declarations were not rejected' }
            Set-Content -NoNewline -Path build.vbuild -Value $validBuild
            Add-Content build.vbuild 'task empty_dependencies = none depends'
            $emptyDependencyOutput = & $binary tasks 2>&1
            $emptyDependencyExitCode = $LASTEXITCODE
            if ($emptyDependencyExitCode -eq 0 -or ($emptyDependencyOutput -join [Environment]::NewLine) -notmatch "'depends' requires at least one task name") {
              throw "empty dependency lists were not rejected: $($emptyDependencyOutput -join ' | ')"
            }
            Set-Content -NoNewline -Path build.vbuild -Value $validBuild
            Add-Content build.vbuild 'task duplicate_dependencies = none depends build, build'
            $duplicateDependencyOutput = & $binary tasks 2>&1
            $duplicateDependencyExitCode = $LASTEXITCODE
            if ($duplicateDependencyExitCode -eq 0 -or ($duplicateDependencyOutput -join [Environment]::NewLine) -notmatch "duplicate dependency 'build'") {
              throw "duplicate task dependencies were not rejected: $($duplicateDependencyOutput -join ' | ')"
            }
            Set-Content -NoNewline -Path build.vbuild -Value $validBuild
            & $binary clean
            if ($LASTEXITCODE -ne 0) { throw 'clean task failed' }
            & $binary test
            if ($LASTEXITCODE -ne 1) { throw 'test task without a tests/ directory should fail clearly' }
            New-Item -ItemType Directory -Force -Path (Join-Path 'tests' 'ignored.vnt') | Out-Null
            $directoryTestOutput = & $binary test 2>&1
            $directoryTestExitCode = $LASTEXITCODE
            if ($directoryTestExitCode -ne 1 -or ($directoryTestOutput -join [Environment]::NewLine) -notmatch 'no tests found|contains no .vnt test programs') {
              throw "VBuild treated a directory as a test source: $($directoryTestOutput -join ' | ')"
            }
            & $binary clean
            if ($LASTEXITCODE -ne 0) { throw 'clean task failed' }
            & $binary clean
            if ($LASTEXITCODE -ne 0) { throw 'repeat clean failed' }
            Add-Content build.vbuild 'task cycle = none depends cycle'
            Add-Content build.vbuild 'task cycle_after_build = none depends build, cycle'
            & $binary cycle_after_build
            if ($LASTEXITCODE -eq 0) { throw 'dependency cycle was not rejected before execution' }
            if (Test-Path build) { throw 'VBuild executed a build dependency before rejecting the cyclic task graph' }
            Set-Content -NoNewline -Path build.vbuild -Value $validBuild
            Add-Content build.vbuild 'task run_without_build = run'
            $artifactName = if ($IsWindows) { 'hello.exe' } else { 'hello' }
            $invalidArtifact = Join-Path 'build' $artifactName
            New-Item -ItemType Directory -Force -Path $invalidArtifact | Out-Null
            $invalidRunOutput = & $binary run_without_build 2>&1
            $invalidRunExitCode = $LASTEXITCODE
            if ($invalidRunExitCode -eq 0 -or ($invalidRunOutput -join [Environment]::NewLine) -notmatch 'output is not a usable executable') {
              throw "run accepted a directory as its executable artifact: $($invalidRunOutput -join ' | ')"
            }
            & $binary clean
            if ($LASTEXITCODE -ne 0) { throw 'clean failed after invalid run artifact test' }
            Set-Content -NoNewline -Path build.vbuild -Value $validBuild
            $lockPath = Join-Path $project '.vbuild.lock'
            $lockStream = [System.IO.File]::Open($lockPath, [System.IO.FileMode]::OpenOrCreate, [System.IO.FileAccess]::ReadWrite, [System.IO.FileShare]::ReadWrite)
            $lockHeld = $false
            try {
              $lockStream.Lock(0, 1)
              $lockHeld = $true
              $lockOutput = & $binary clean 2>&1
              $lockExitCode = $LASTEXITCODE
              if ($lockExitCode -eq 0 -or ($lockOutput -join "`n") -notmatch 'another VBuild process is using this project') {
                throw "Windows project lock was not enforced: $($lockOutput -join ' | ')"
              }
              $verifyOutput = & $binary verify 2>&1
              $verifyExitCode = $LASTEXITCODE
              if ($verifyExitCode -eq 0 -or ($verifyOutput -join "`n") -notmatch 'another VBuild process is using this project') {
                throw "task graph dependency bypassed the project lock: $($verifyOutput -join ' | ')"
              }
            } finally {
              if ($lockHeld) { $lockStream.Unlock(0, 1) }
              $lockStream.Dispose()
            }
            & $binary clean
            if ($LASTEXITCODE -ne 0) { throw 'clean failed after releasing the Windows project lock' }

            if ($IsWindows) {
            # Keep a VBuild parent alive in "run", then terminate it. Its child must
            # not inherit the lock handle, and the OS must release the parent's lock.
            $holdSource = @'
          #include <windows.h>
          #include <stdio.h>
          int main(void) {
              FILE *file = fopen("hold.pid", "w");
              if (!file) return 2;
              fprintf(file, "%lu", (unsigned long)GetCurrentProcessId());
              fclose(file);
              Sleep(60000);
              return 0;
          }
          '@
            Set-Content -NoNewline -Path hold.c -Value $holdSource
            New-Item -ItemType Directory -Force -Path build | Out-Null
            gcc hold.c -o build/hold.exe
            if ($LASTEXITCODE -ne 0) { throw 'could not compile Windows lock-holder test program' }
            (Get-Content -Raw vbuild.properties).Replace('output = hello', 'output = hold') | Set-Content -NoNewline vbuild.properties
            Add-Content build.vbuild 'task hold = run'
            $vbuildProcess = Start-Process -FilePath $binary -ArgumentList 'hold' -WorkingDirectory $project -PassThru -WindowStyle Hidden
            try {
              $deadline = [DateTime]::UtcNow.AddSeconds(10)
              while (-not (Test-Path hold.pid) -and [DateTime]::UtcNow -lt $deadline) {
                Start-Sleep -Milliseconds 50
              }
              if (-not (Test-Path hold.pid)) { throw 'VBuild run child did not start' }
              try {
                [System.IO.File]::Delete($lockPath)
              } catch {
                # Expected: VBuild's lock handle deliberately denies FILE_SHARE_DELETE.
              }
              if (-not (Test-Path $lockPath)) { throw 'active Windows project lock file was deleted' }
              Stop-Process -Id $vbuildProcess.Id -Force
              $vbuildProcess.WaitForExit()
              $holderPid = [int](Get-Content -Raw hold.pid)
              Stop-Process -Id $holderPid -Force -ErrorAction SilentlyContinue
              Wait-Process -Id $holderPid -Timeout 5 -ErrorAction SilentlyContinue
            } finally {
              if (-not $vbuildProcess.HasExited) { Stop-Process -Id $vbuildProcess.Id -Force }
            }
            & $binary clean
            if ($LASTEXITCODE -ne 0) { throw 'VBuild did not release its lock after forced process termination' }
            }

            Add-Content build.vbuild 'task broken = none depends missing'
            & $binary tasks
            if ($LASTEXITCODE -eq 0) { throw 'undefined dependency was not rejected' }
            & $binary init
            if ($LASTEXITCODE -eq 0) { throw 'init overwrote existing project files' }
            $existingSourceProject = Join-Path $env:RUNNER_TEMP 'vbuild existing source project'
            New-Item -ItemType Directory -Force -Path (Join-Path $existingSourceProject 'src') | Out-Null
            Set-Content -NoNewline -Path (Join-Path $existingSourceProject 'src/main.vnt') -Value 'print("preserve this source")'
            Push-Location $existingSourceProject
            try {
              $existingSourceInitOutput = & $binary init 2>&1
              if ($LASTEXITCODE -eq 0) { throw 'init overwrote an existing src/main.vnt' }
              if ((Get-Content -Raw src/main.vnt) -notmatch 'preserve this source') { throw 'init modified an existing source file' }
              if ((Test-Path build.vbuild) -or (Test-Path vbuild.properties)) { throw 'failed init left partial project configuration behind' }
            } finally {
              Pop-Location
            }
            $global:LASTEXITCODE = 0
          } finally {
            Pop-Location
          }

  vbuild-real-compiler:
    name: VBuild compiles and runs a real VNT program (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build VNT compiler
        shell: bash
        run: |
          gcc -O3 -Iinclude -Isrc/compiler \
            src/main.c src/modules.c src/lexer.c \
            src/parser/parser.c src/parser/primary.c src/parser/unary.c \
            src/parser/binary.c src/parser/functions.c src/parser/statements.c \
            src/parser/simple_statements.c src/parser/control.c src/parser/loops.c \
            src/parser/assignments.c src/ast.c src/compiler/compiler.c \
            src/compiler/typecheck.c src/compiler/ir.c src/compiler/ir_lower.c \
            src/compiler/cfg.c src/compiler/x86_backend.c src/compiler/freestanding_x86.c \
            -o vnt
      - name: Build native VBuild
        run: gcc -std=c11 -Wall -Wextra -Werror -O2 tools/vbuild.c -o vbuild
      - name: Compile and run starter project through VBuild
        shell: bash
        run: |
          project="$RUNNER_TEMP/vbuild integration project"
          mkdir -p "$project"
          cd "$project"
          "$GITHUB_WORKSPACE/vbuild" init
          cat > vbuild.properties <<EOF
          project.name = hello
          project.version = 0.1.0
          source = src/main.vnt
          output = hello
          compiler = vnt
          toolchain = $GITHUB_WORKSPACE
          EOF
          mkdir -p libs
          mkdir -p libs/nested
          cat > libs/math_helpers.vnt <<'EOF'
          import "nested/bonus.vnt" as bonus
          export fun square(value: int) -> int {
              return value * value + bonus.increment()
          }
          EOF
          cat > libs/nested/bonus.vnt <<'EOF'
          export fun increment() -> int {
              return 0
          }
          EOF
          cat > src/main.vnt <<'EOF'
          import "math_helpers.vnt" as math_helpers
          print(math_helpers.square(7))
          EOF
          cat > build.vbuild <<'EOF'
          target exe
          repositories {
              local("libs")
          }
          dependencies {
              implementation("math_helpers.vnt")
          }
          task build = build
          task run = run depends build
          task check = check
          task clean = clean
          task test = test
          EOF
          # FIFOs and device nodes are not valid VNT source modules.
          # First exercise importer-relative resolution.
          mkfifo src/non_regular_import.vnt
          cp src/main.vnt "$RUNNER_TEMP/vbuild-main-before-fifo.vnt"
          { printf 'import "non_regular_import.vnt" as invalid_module\n'; cat "$RUNNER_TEMP/vbuild-main-before-fifo.vnt"; } > src/main.vnt
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-fifo-relative-import.log" 2>&1; then
            echo 'VBuild accepted a FIFO as an importer-relative module'
            exit 1
          fi
          grep -Fq "imported module 'non_regular_import.vnt'" "$RUNNER_TEMP/vbuild-fifo-relative-import.log"
          mv "$RUNNER_TEMP/vbuild-main-before-fifo.vnt" src/main.vnt
          rm src/non_regular_import.vnt
          # Then exercise configured local-repository resolution.
          mkfifo libs/non_regular_import.vnt
          cp src/main.vnt "$RUNNER_TEMP/vbuild-main-before-fifo.vnt"
          { printf 'import "non_regular_import.vnt" as invalid_module\n'; cat "$RUNNER_TEMP/vbuild-main-before-fifo.vnt"; } > src/main.vnt
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-fifo-repository-import.log" 2>&1; then
            echo 'VBuild accepted a FIFO as a repository module'
            exit 1
          fi
          grep -Fq "imported module 'non_regular_import.vnt'" "$RUNNER_TEMP/vbuild-fifo-repository-import.log"
          mv "$RUNNER_TEMP/vbuild-main-before-fifo.vnt" src/main.vnt
          rm libs/non_regular_import.vnt
          # Symlinks must not escape the configured repository boundary.
          ln -s ../src/math_helpers.vnt libs/symlink_import.vnt
          cp src/main.vnt "$RUNNER_TEMP/vbuild-main-before-symlink.vnt"
          { printf 'import "symlink_import.vnt" as invalid_module\\n'; cat "$RUNNER_TEMP/vbuild-main-before-symlink.vnt"; } > src/main.vnt
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-symlink-import.log" 2>&1; then
            echo 'VBuild accepted a symlinked imported module'
            exit 1
          fi
          grep -Fq "imported module 'symlink_import.vnt'" "$RUNNER_TEMP/vbuild-symlink-import.log"
          mv "$RUNNER_TEMP/vbuild-main-before-symlink.vnt" src/main.vnt
          rm libs/symlink_import.vnt
          # Importer-relative paths must reject symlinked intermediate directories.
          ln -s ../libs src/linked_modules
          cp src/main.vnt "$RUNNER_TEMP/vbuild-main-before-directory-symlink.vnt"
          { printf 'import "linked_modules/math_helpers.vnt" as invalid_module\\n'; cat "$RUNNER_TEMP/vbuild-main-before-directory-symlink.vnt"; } > src/main.vnt
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-directory-symlink-import.log" 2>&1; then
            echo 'VBuild accepted an imported module through a symlinked directory'
            exit 1
          fi
          grep -Fq "imported module 'linked_modules/math_helpers.vnt'" "$RUNNER_TEMP/vbuild-directory-symlink-import.log"
          mv "$RUNNER_TEMP/vbuild-main-before-directory-symlink.vnt" src/main.vnt
          rm src/linked_modules
          # A repository directory reached through a symlink must be rejected too.
          ln -s libs libs-link
          cp build.vbuild "$RUNNER_TEMP/vbuild-build-before-symlink.vbuild"
          sed -i 's|local("libs")|local("libs-link")|' build.vbuild
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-symlink-repository.log" 2>&1; then
            echo 'VBuild accepted a symlinked repository directory'
            exit 1
          fi
          grep -Fq "dependency 'math_helpers.vnt' was not found" "$RUNNER_TEMP/vbuild-symlink-repository.log"
          mv "$RUNNER_TEMP/vbuild-build-before-symlink.vbuild" build.vbuild
          rm libs-link
          mkfifo libs/non_regular_dependency.vnt
          cp build.vbuild "$RUNNER_TEMP/vbuild-build-before-fifo.vbuild"
          sed -i '/implementation("math_helpers.vnt")/a\    implementation("non_regular_dependency.vnt")' build.vbuild
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-fifo-dependency.log" 2>&1; then
            echo 'VBuild accepted a FIFO as a declared dependency'
            exit 1
          fi
          grep -Fq "dependency 'non_regular_dependency.vnt' was not found" "$RUNNER_TEMP/vbuild-fifo-dependency.log"
          mv "$RUNNER_TEMP/vbuild-build-before-fifo.vbuild" build.vbuild
          rm libs/non_regular_dependency.vnt
          # The configured root source must also be a regular file.
          mkfifo src/non_regular_source.vnt
          cp vbuild.properties "$RUNNER_TEMP/vbuild-properties-before-fifo.vbuild"
          sed -i 's|^source = src/main.vnt$|source = src/non_regular_source.vnt|' vbuild.properties
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-fifo-source.log" 2>&1; then
            echo 'VBuild accepted a FIFO as the configured root source'
            exit 1
          fi
          grep -Fq 'source is not a readable regular file' "$RUNNER_TEMP/vbuild-fifo-source.log"
          mv "$RUNNER_TEMP/vbuild-properties-before-fifo.vbuild" vbuild.properties
          rm src/non_regular_source.vnt
          # Fingerprinting must reject special files instead of blocking on a FIFO.
          runtime_source="$GITHUB_WORKSPACE/src/compiler/native_runtime.c"
          mv "$runtime_source" "$runtime_source.vbuild-fingerprint-backup"
          mkfifo "$runtime_source"
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-fifo-fingerprint.log" 2>&1; then
            echo 'VBuild accepted a FIFO as a fingerprint input'
            exit 1
          fi
          mv "$runtime_source.vbuild-fingerprint-backup" "$runtime_source"
          grep -Fq 'fingerprint input is not a readable regular file' "$RUNNER_TEMP/vbuild-fifo-fingerprint.log"
          "$GITHUB_WORKSPACE/vbuild" build
          test -x build/hello
          # PATH-resolved compiler changes must invalidate the cache.
          compiler_tools="$RUNNER_TEMP/vbuild compiler tools"
          mkdir -p "$compiler_tools"
          cat > "$compiler_tools/vnt-cache-wrapper" <<'EOF'
          #!/bin/sh
          if [ "${VBUILD_TEST_FAIL_COMPILER:-}" = "1" ]; then
            : > "$4"
            exit 1
          fi
          if [ "${VBUILD_TEST_INVALID_OUTPUT:-}" = "1" ]; then
            printf 'not an executable\\n' > "$4"
            chmod 644 "$4"
            exit 0
          fi
          exec "$VNT_TEST_REAL_COMPILER" "$@"
          EOF
          export VNT_TEST_REAL_COMPILER="$GITHUB_WORKSPACE/vnt"
          chmod +x "$compiler_tools/vnt-cache-wrapper"
          sed -i 's/^compiler = vnt$/compiler = vnt-cache-wrapper/' vbuild.properties
          export PATH="$compiler_tools:$PATH"
          path_first_build="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\n' "$path_first_build" | grep -Fq 'Built '
          path_cached_build="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\n' "$path_cached_build" | grep -Fq 'Up to date:'
          printf '# changed compiler wrapper identity\n' >> "$compiler_tools/vnt-cache-wrapper"
          path_compiler_rebuild="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\n' "$path_compiler_rebuild" | grep -Fq 'Built '
          # Front-end checking must not require build-only runtime inputs.
          runtime_source="$GITHUB_WORKSPACE/src/compiler/native_runtime.c"
          mv "$runtime_source" "$runtime_source.vbuild-check-hidden"
          if ! "$GITHUB_WORKSPACE/vbuild" check > "$RUNNER_TEMP/vbuild-check-without-runtime.log" 2>&1; then
            mv "$runtime_source.vbuild-check-hidden" "$runtime_source"
            cat "$RUNNER_TEMP/vbuild-check-without-runtime.log"
            exit 1
          fi
          mv "$runtime_source.vbuild-check-hidden" "$runtime_source"
          # A failed compiler must not leave an old manifest authorizing a damaged artifact.
          cp build/hello "$RUNNER_TEMP/vbuild-good-artifact"
          cp src/main.vnt "$RUNNER_TEMP/vbuild-main-backup.vnt"
          printf '\n' >> src/main.vnt
          if VBUILD_TEST_FAIL_COMPILER=1 "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-failed-build.log" 2>&1; then
            echo 'expected injected compiler failure'
            exit 1
          fi
          cmp build/hello "$RUNNER_TEMP/vbuild-good-artifact"
          if compgen -G 'build/hello.vbuild-artifact-*' > /dev/null; then
            echo 'failed compiler left a temporary artifact behind'
            exit 1
          fi
          if VBUILD_TEST_INVALID_OUTPUT=1 "$GITHUB_WORKSPACE/vbuild" build --force > "$RUNNER_TEMP/vbuild-invalid-output.log" 2>&1; then
            echo 'non-executable compiler output was accepted as a successful artifact'
            exit 1
          fi
          if ! grep -Fq 'temporary output is not a usable artifact' "$RUNNER_TEMP/vbuild-invalid-output.log"; then
            cat "$RUNNER_TEMP/vbuild-invalid-output.log"
            exit 1
          fi
          cmp build/hello "$RUNNER_TEMP/vbuild-good-artifact"
          cp "$RUNNER_TEMP/vbuild-main-backup.vnt" src/main.vnt
          recovery_build="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\n' "$recovery_build" | grep -Fq 'Up to date:'
          cmp build/hello "$RUNNER_TEMP/vbuild-good-artifact"
          # -F makes flock exec the holder directly, so its PID is the lock owner.
          rm -f "$RUNNER_TEMP/vbuild-lock-held"
          flock -n -F .vbuild.lock sh -c 'touch "$RUNNER_TEMP/vbuild-lock-held"; exec sleep 60' > "$RUNNER_TEMP/vbuild-lock-holder.log" 2>&1 &
          lock_holder_pid=$!
          trap 'kill "$lock_holder_pid" 2>/dev/null || true; wait "$lock_holder_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            [ -e "$RUNNER_TEMP/vbuild-lock-held" ] && break
            sleep 0.05
          done
          if [ ! -e "$RUNNER_TEMP/vbuild-lock-held" ]; then
            cat "$RUNNER_TEMP/vbuild-lock-holder.log"
            exit 1
          fi
          # A symlinked working-directory alias must resolve to the same lock object.
          project_alias="$RUNNER_TEMP/vbuild-project-alias"
          ln -s "$PWD" "$project_alias"
          if (cd "$project_alias" && "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-lock-alias.log" 2>&1); then
            echo 'project-directory alias bypassed the active lock'
            exit 1
          fi
          if ! grep -Fq 'another VBuild process is using this project' "$RUNNER_TEMP/vbuild-lock-alias.log"; then cat "$RUNNER_TEMP/vbuild-lock-alias.log"; exit 1; fi
          # A check-only task graph is read-only and must not contend for the lock.
          "$GITHUB_WORKSPACE/vbuild" check > "$RUNNER_TEMP/vbuild-lock-check.log" 2>&1 || {
            cat "$RUNNER_TEMP/vbuild-lock-check.log"
            exit 1
          }
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-lock-build.log" 2>&1; then
            echo 'concurrent build unexpectedly acquired the project lock'
            exit 1
          fi
          if ! grep -Fq 'another VBuild process is using this project' "$RUNNER_TEMP/vbuild-lock-build.log"; then cat "$RUNNER_TEMP/vbuild-lock-build.log"; cat "$RUNNER_TEMP/vbuild-lock-holder.log"; exit 1; fi
          if "$GITHUB_WORKSPACE/vbuild" clean > "$RUNNER_TEMP/vbuild-lock-clean.log" 2>&1; then
            echo 'clean unexpectedly acquired the project lock during a build'
            exit 1
          fi
          if ! grep -Fq 'another VBuild process is using this project' "$RUNNER_TEMP/vbuild-lock-clean.log"; then cat "$RUNNER_TEMP/vbuild-lock-clean.log"; cat "$RUNNER_TEMP/vbuild-lock-holder.log"; exit 1; fi
          if "$GITHUB_WORKSPACE/vbuild" init > "$RUNNER_TEMP/vbuild-lock-init.log" 2>&1; then
            echo 'init unexpectedly acquired the project lock during another operation'
            exit 1
          fi
          if ! grep -Fq 'another VBuild process is using this project' "$RUNNER_TEMP/vbuild-lock-init.log"; then cat "$RUNNER_TEMP/vbuild-lock-init.log"; exit 1; fi
          # Killing the lock owner must release the OS-managed lock without cleanup code.
          kill "$lock_holder_pid"
          wait "$lock_holder_pid" || true
          trap - EXIT
          released_lock_build="$("$GITHUB_WORKSPACE/vbuild" build --force)"
          printf '%s\n' "$released_lock_build" | grep -Fq 'Built '
          output="$("$GITHUB_WORKSPACE/vbuild" run)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fq '49'
          incremental="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\n' "$incremental" | grep -Fq 'Up to date:'
          sleep 1
          cat > libs/nested/bonus.vnt <<'EOF'
          export fun increment() -> int {
              return 1
          }
          EOF
          transitive_rebuild="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\\n' "$transitive_rebuild" | grep -Fq 'Built '
          output="$("$GITHUB_WORKSPACE/vbuild" run)"
          printf '%s\\n' "$output" | grep -Fq '50'
          sleep 1
          cat > libs/math_helpers.vnt <<'EOF'
          import "nested/bonus.vnt" as bonus
          export fun square(value: int) -> int {
              return value * value + bonus.increment() + 1
          }
          EOF
          dependency_rebuild="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\\n' "$dependency_rebuild" | grep -Fq 'Built '
          output="$("$GITHUB_WORKSPACE/vbuild" run)"
          printf '%s\\n' "$output" | grep -Fq '51'
          sleep 1
          touch "$GITHUB_WORKSPACE/src/compiler/native_runtime.c"
          runtime_rebuild="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\\n' "$runtime_rebuild" | grep -Fq 'Built '
          output="$("$GITHUB_WORKSPACE/vbuild" run)"
          printf '%s\\n' "$output" | grep -Fq '51'
          # Content changes must invalidate the build even when mtime is restored.
          cp -p libs/nested/bonus.vnt "$RUNNER_TEMP/vbuild-bonus-backup.vnt"
          sed -i 's/return 1/return 2/' libs/nested/bonus.vnt
          touch -r "$RUNNER_TEMP/vbuild-bonus-backup.vnt" libs/nested/bonus.vnt
          same_mtime_rebuild="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\n' "$same_mtime_rebuild" | grep -Fq 'Built '
          output="$("$GITHUB_WORKSPACE/vbuild" run)"
          printf '%s\n' "$output" | grep -Fq '52'
          forced="$("$GITHUB_WORKSPACE/vbuild" build --force)"
          printf '%s\n' "$forced" | grep -Fq 'Built '
          mkdir -p tests
          printf 'print("VBUILD_TEST_OK")\n' > tests/smoke.vnt
          test_output="$("$GITHUB_WORKSPACE/vbuild" test)"
          printf '%s\n' "$test_output"
          printf '%s\n' "$test_output" | grep -Fq 'VBUILD_TEST_OK'
      - name: Build a freestanding ELF through VBuild
        shell: bash
        run: |
          project="$RUNNER_TEMP/vbuild elf integration project"
          mkdir -p "$project"
          cd "$project"
          "$GITHUB_WORKSPACE/vbuild" init
          cp "$GITHUB_WORKSPACE/tests/freestanding_minimal.vnt" src/main.vnt
          cat > vbuild.properties <<EOF
          project.name = kernel
          project.version = 0.1.0
          source = src/main.vnt
          output = kernel
          compiler = vnt
          toolchain = $GITHUB_WORKSPACE
          EOF
          sed -i 's/^target exe$/target elf/' build.vbuild
          "$GITHUB_WORKSPACE/vbuild" build
          test -x build/kernel.elf
          readelf -h build/kernel.elf | grep -Fq 'ELF64'
          sleep 1
          touch "$GITHUB_WORKSPACE/freestanding/x86_64.ld"
          linker_rebuild="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\\n' "$linker_rebuild" | grep -Fq 'Built '
          test -x build/kernel.elf
          readelf -h build/kernel.elf | grep -Fq 'ELF64', 'toolchain = C:relative-toolchain'
              Set-Content -NoNewline -Path vbuild.properties -Value $driveRelativeProperties
              $driveRelativeOutput = & $binary check 2>&1
              $driveRelativeExitCode = $LASTEXITCODE
              if ($driveRelativeExitCode -eq 0 -or ($driveRelativeOutput -join "`n") -notmatch 'drive-relative paths are ambiguous') {
                throw "ambiguous Windows drive-relative toolchain paths were not rejected: $($driveRelativeOutput -join ' | ')"
              }
              Set-Content -NoNewline -Path vbuild.properties -Value $validProperties
            }
            Add-Content vbuild.properties 'source = src/duplicate.vnt'
            $duplicatePropertyOutput = & $binary build 2>&1
            $duplicatePropertyExitCode = $LASTEXITCODE
            if ($duplicatePropertyExitCode -eq 0 -or ($duplicatePropertyOutput -join "`n") -notmatch "duplicate property 'source'") {
              throw "duplicate project properties were not rejected with a targeted diagnostic: $($duplicatePropertyOutput -join ' | ')"
            }
            Set-Content -NoNewline -Path vbuild.properties -Value $validProperties
            Add-Content vbuild.properties 'project.version = "unterminated'
            $malformedPropertyOutput = & $binary build 2>&1
            $malformedPropertyExitCode = $LASTEXITCODE
            if ($malformedPropertyExitCode -eq 0 -or ($malformedPropertyOutput -join "`n") -notmatch "unterminated quoted value for property 'project.version'") {
              throw "malformed quoted properties were not rejected with a targeted diagnostic: $($malformedPropertyOutput -join ' | ')"
            }
            Set-Content -NoNewline -Path vbuild.properties -Value $validProperties
            Add-Content build.vbuild 'task verify = none depends check, build'
            & $binary tasks
            if ($LASTEXITCODE -ne 0) { throw 'task graph parsing failed' }
            $validBuild = Get-Content -Raw build.vbuild
            Add-Content build.vbuild 'target elf'
            & $binary tasks
            if ($LASTEXITCODE -eq 0) { throw 'duplicate target declarations were not rejected' }
            Set-Content -NoNewline -Path build.vbuild -Value $validBuild
            Add-Content build.vbuild 'task empty_dependencies = none depends'
            $emptyDependencyOutput = & $binary tasks 2>&1
            $emptyDependencyExitCode = $LASTEXITCODE
            if ($emptyDependencyExitCode -eq 0 -or ($emptyDependencyOutput -join [Environment]::NewLine) -notmatch "'depends' requires at least one task name") {
              throw "empty dependency lists were not rejected: $($emptyDependencyOutput -join ' | ')"
            }
            Set-Content -NoNewline -Path build.vbuild -Value $validBuild
            Add-Content build.vbuild 'task duplicate_dependencies = none depends build, build'
            $duplicateDependencyOutput = & $binary tasks 2>&1
            $duplicateDependencyExitCode = $LASTEXITCODE
            if ($duplicateDependencyExitCode -eq 0 -or ($duplicateDependencyOutput -join [Environment]::NewLine) -notmatch "duplicate dependency 'build'") {
              throw "duplicate task dependencies were not rejected: $($duplicateDependencyOutput -join ' | ')"
            }
            Set-Content -NoNewline -Path build.vbuild -Value $validBuild
            & $binary clean
            if ($LASTEXITCODE -ne 0) { throw 'clean task failed' }
            & $binary test
            if ($LASTEXITCODE -ne 1) { throw 'test task without a tests/ directory should fail clearly' }
            New-Item -ItemType Directory -Force -Path (Join-Path 'tests' 'ignored.vnt') | Out-Null
            $directoryTestOutput = & $binary test 2>&1
            $directoryTestExitCode = $LASTEXITCODE
            if ($directoryTestExitCode -ne 1 -or ($directoryTestOutput -join [Environment]::NewLine) -notmatch 'no tests found|contains no .vnt test programs') {
              throw "VBuild treated a directory as a test source: $($directoryTestOutput -join ' | ')"
            }
            & $binary clean
            if ($LASTEXITCODE -ne 0) { throw 'clean task failed' }
            & $binary clean
            if ($LASTEXITCODE -ne 0) { throw 'repeat clean failed' }
            Add-Content build.vbuild 'task cycle = none depends cycle'
            Add-Content build.vbuild 'task cycle_after_build = none depends build, cycle'
            & $binary cycle_after_build
            if ($LASTEXITCODE -eq 0) { throw 'dependency cycle was not rejected before execution' }
            if (Test-Path build) { throw 'VBuild executed a build dependency before rejecting the cyclic task graph' }
            Set-Content -NoNewline -Path build.vbuild -Value $validBuild
            Add-Content build.vbuild 'task run_without_build = run'
            $artifactName = if ($IsWindows) { 'hello.exe' } else { 'hello' }
            $invalidArtifact = Join-Path 'build' $artifactName
            New-Item -ItemType Directory -Force -Path $invalidArtifact | Out-Null
            $invalidRunOutput = & $binary run_without_build 2>&1
            $invalidRunExitCode = $LASTEXITCODE
            if ($invalidRunExitCode -eq 0 -or ($invalidRunOutput -join [Environment]::NewLine) -notmatch 'output is not a usable executable') {
              throw "run accepted a directory as its executable artifact: $($invalidRunOutput -join ' | ')"
            }
            & $binary clean
            if ($LASTEXITCODE -ne 0) { throw 'clean failed after invalid run artifact test' }
            Set-Content -NoNewline -Path build.vbuild -Value $validBuild
            $lockPath = Join-Path $project '.vbuild.lock'
            $lockStream = [System.IO.File]::Open($lockPath, [System.IO.FileMode]::OpenOrCreate, [System.IO.FileAccess]::ReadWrite, [System.IO.FileShare]::ReadWrite)
            $lockHeld = $false
            try {
              $lockStream.Lock(0, 1)
              $lockHeld = $true
              $lockOutput = & $binary clean 2>&1
              $lockExitCode = $LASTEXITCODE
              if ($lockExitCode -eq 0 -or ($lockOutput -join "`n") -notmatch 'another VBuild process is using this project') {
                throw "Windows project lock was not enforced: $($lockOutput -join ' | ')"
              }
              $verifyOutput = & $binary verify 2>&1
              $verifyExitCode = $LASTEXITCODE
              if ($verifyExitCode -eq 0 -or ($verifyOutput -join "`n") -notmatch 'another VBuild process is using this project') {
                throw "task graph dependency bypassed the project lock: $($verifyOutput -join ' | ')"
              }
            } finally {
              if ($lockHeld) { $lockStream.Unlock(0, 1) }
              $lockStream.Dispose()
            }
            & $binary clean
            if ($LASTEXITCODE -ne 0) { throw 'clean failed after releasing the Windows project lock' }

            if ($IsWindows) {
            # Keep a VBuild parent alive in "run", then terminate it. Its child must
            # not inherit the lock handle, and the OS must release the parent's lock.
            $holdSource = @'
          #include <windows.h>
          #include <stdio.h>
          int main(void) {
              FILE *file = fopen("hold.pid", "w");
              if (!file) return 2;
              fprintf(file, "%lu", (unsigned long)GetCurrentProcessId());
              fclose(file);
              Sleep(60000);
              return 0;
          }
          '@
            Set-Content -NoNewline -Path hold.c -Value $holdSource
            New-Item -ItemType Directory -Force -Path build | Out-Null
            gcc hold.c -o build/hold.exe
            if ($LASTEXITCODE -ne 0) { throw 'could not compile Windows lock-holder test program' }
            (Get-Content -Raw vbuild.properties).Replace('output = hello', 'output = hold') | Set-Content -NoNewline vbuild.properties
            Add-Content build.vbuild 'task hold = run'
            $vbuildProcess = Start-Process -FilePath $binary -ArgumentList 'hold' -WorkingDirectory $project -PassThru -WindowStyle Hidden
            try {
              $deadline = [DateTime]::UtcNow.AddSeconds(10)
              while (-not (Test-Path hold.pid) -and [DateTime]::UtcNow -lt $deadline) {
                Start-Sleep -Milliseconds 50
              }
              if (-not (Test-Path hold.pid)) { throw 'VBuild run child did not start' }
              try {
                [System.IO.File]::Delete($lockPath)
              } catch {
                # Expected: VBuild's lock handle deliberately denies FILE_SHARE_DELETE.
              }
              if (-not (Test-Path $lockPath)) { throw 'active Windows project lock file was deleted' }
              Stop-Process -Id $vbuildProcess.Id -Force
              $vbuildProcess.WaitForExit()
              $holderPid = [int](Get-Content -Raw hold.pid)
              Stop-Process -Id $holderPid -Force -ErrorAction SilentlyContinue
              Wait-Process -Id $holderPid -Timeout 5 -ErrorAction SilentlyContinue
            } finally {
              if (-not $vbuildProcess.HasExited) { Stop-Process -Id $vbuildProcess.Id -Force }
            }
            & $binary clean
            if ($LASTEXITCODE -ne 0) { throw 'VBuild did not release its lock after forced process termination' }
            }

            Add-Content build.vbuild 'task broken = none depends missing'
            & $binary tasks
            if ($LASTEXITCODE -eq 0) { throw 'undefined dependency was not rejected' }
            & $binary init
            if ($LASTEXITCODE -eq 0) { throw 'init overwrote existing project files' }
            $existingSourceProject = Join-Path $env:RUNNER_TEMP 'vbuild existing source project'
            New-Item -ItemType Directory -Force -Path (Join-Path $existingSourceProject 'src') | Out-Null
            Set-Content -NoNewline -Path (Join-Path $existingSourceProject 'src/main.vnt') -Value 'print("preserve this source")'
            Push-Location $existingSourceProject
            try {
              $existingSourceInitOutput = & $binary init 2>&1
              if ($LASTEXITCODE -eq 0) { throw 'init overwrote an existing src/main.vnt' }
              if ((Get-Content -Raw src/main.vnt) -notmatch 'preserve this source') { throw 'init modified an existing source file' }
              if ((Test-Path build.vbuild) -or (Test-Path vbuild.properties)) { throw 'failed init left partial project configuration behind' }
            } finally {
              Pop-Location
            }
            $global:LASTEXITCODE = 0
          } finally {
            Pop-Location
          }

  vbuild-real-compiler:
    name: VBuild compiles and runs a real VNT program (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build VNT compiler
        shell: bash
        run: |
          gcc -O3 -Iinclude -Isrc/compiler \
            src/main.c src/modules.c src/lexer.c \
            src/parser/parser.c src/parser/primary.c src/parser/unary.c \
            src/parser/binary.c src/parser/functions.c src/parser/statements.c \
            src/parser/simple_statements.c src/parser/control.c src/parser/loops.c \
            src/parser/assignments.c src/ast.c src/compiler/compiler.c \
            src/compiler/typecheck.c src/compiler/ir.c src/compiler/ir_lower.c \
            src/compiler/cfg.c src/compiler/x86_backend.c src/compiler/freestanding_x86.c \
            -o vnt
      - name: Build native VBuild
        run: gcc -std=c11 -Wall -Wextra -Werror -O2 tools/vbuild.c -o vbuild
      - name: Compile and run starter project through VBuild
        shell: bash
        run: |
          project="$RUNNER_TEMP/vbuild integration project"
          mkdir -p "$project"
          cd "$project"
          "$GITHUB_WORKSPACE/vbuild" init
          cat > vbuild.properties <<EOF
          project.name = hello
          project.version = 0.1.0
          source = src/main.vnt
          output = hello
          compiler = vnt
          toolchain = $GITHUB_WORKSPACE
          EOF
          mkdir -p libs
          mkdir -p libs/nested
          cat > libs/math_helpers.vnt <<'EOF'
          import "nested/bonus.vnt" as bonus
          export fun square(value: int) -> int {
              return value * value + bonus.increment()
          }
          EOF
          cat > libs/nested/bonus.vnt <<'EOF'
          export fun increment() -> int {
              return 0
          }
          EOF
          cat > src/main.vnt <<'EOF'
          import "math_helpers.vnt" as math_helpers
          print(math_helpers.square(7))
          EOF
          cat > build.vbuild <<'EOF'
          target exe
          repositories {
              local("libs")
          }
          dependencies {
              implementation("math_helpers.vnt")
          }
          task build = build
          task run = run depends build
          task check = check
          task clean = clean
          task test = test
          EOF
          # FIFOs and device nodes are not valid VNT source modules.
          # First exercise importer-relative resolution.
          mkfifo src/non_regular_import.vnt
          cp src/main.vnt "$RUNNER_TEMP/vbuild-main-before-fifo.vnt"
          { printf 'import "non_regular_import.vnt" as invalid_module\n'; cat "$RUNNER_TEMP/vbuild-main-before-fifo.vnt"; } > src/main.vnt
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-fifo-relative-import.log" 2>&1; then
            echo 'VBuild accepted a FIFO as an importer-relative module'
            exit 1
          fi
          grep -Fq "imported module 'non_regular_import.vnt'" "$RUNNER_TEMP/vbuild-fifo-relative-import.log"
          mv "$RUNNER_TEMP/vbuild-main-before-fifo.vnt" src/main.vnt
          rm src/non_regular_import.vnt
          # Then exercise configured local-repository resolution.
          mkfifo libs/non_regular_import.vnt
          cp src/main.vnt "$RUNNER_TEMP/vbuild-main-before-fifo.vnt"
          { printf 'import "non_regular_import.vnt" as invalid_module\n'; cat "$RUNNER_TEMP/vbuild-main-before-fifo.vnt"; } > src/main.vnt
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-fifo-repository-import.log" 2>&1; then
            echo 'VBuild accepted a FIFO as a repository module'
            exit 1
          fi
          grep -Fq "imported module 'non_regular_import.vnt'" "$RUNNER_TEMP/vbuild-fifo-repository-import.log"
          mv "$RUNNER_TEMP/vbuild-main-before-fifo.vnt" src/main.vnt
          rm libs/non_regular_import.vnt
          # Symlinks must not escape the configured repository boundary.
          ln -s ../src/math_helpers.vnt libs/symlink_import.vnt
          cp src/main.vnt "$RUNNER_TEMP/vbuild-main-before-symlink.vnt"
          { printf 'import "symlink_import.vnt" as invalid_module\\n'; cat "$RUNNER_TEMP/vbuild-main-before-symlink.vnt"; } > src/main.vnt
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-symlink-import.log" 2>&1; then
            echo 'VBuild accepted a symlinked imported module'
            exit 1
          fi
          grep -Fq "imported module 'symlink_import.vnt'" "$RUNNER_TEMP/vbuild-symlink-import.log"
          mv "$RUNNER_TEMP/vbuild-main-before-symlink.vnt" src/main.vnt
          rm libs/symlink_import.vnt
          # Importer-relative paths must reject symlinked intermediate directories.
          ln -s ../libs src/linked_modules
          cp src/main.vnt "$RUNNER_TEMP/vbuild-main-before-directory-symlink.vnt"
          { printf 'import "linked_modules/math_helpers.vnt" as invalid_module\\n'; cat "$RUNNER_TEMP/vbuild-main-before-directory-symlink.vnt"; } > src/main.vnt
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-directory-symlink-import.log" 2>&1; then
            echo 'VBuild accepted an imported module through a symlinked directory'
            exit 1
          fi
          grep -Fq "imported module 'linked_modules/math_helpers.vnt'" "$RUNNER_TEMP/vbuild-directory-symlink-import.log"
          mv "$RUNNER_TEMP/vbuild-main-before-directory-symlink.vnt" src/main.vnt
          rm src/linked_modules
          # A repository directory reached through a symlink must be rejected too.
          ln -s libs libs-link
          cp build.vbuild "$RUNNER_TEMP/vbuild-build-before-symlink.vbuild"
          sed -i 's|local("libs")|local("libs-link")|' build.vbuild
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-symlink-repository.log" 2>&1; then
            echo 'VBuild accepted a symlinked repository directory'
            exit 1
          fi
          grep -Fq "dependency 'math_helpers.vnt' was not found" "$RUNNER_TEMP/vbuild-symlink-repository.log"
          mv "$RUNNER_TEMP/vbuild-build-before-symlink.vbuild" build.vbuild
          rm libs-link
          mkfifo libs/non_regular_dependency.vnt
          cp build.vbuild "$RUNNER_TEMP/vbuild-build-before-fifo.vbuild"
          sed -i '/implementation("math_helpers.vnt")/a\    implementation("non_regular_dependency.vnt")' build.vbuild
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-fifo-dependency.log" 2>&1; then
            echo 'VBuild accepted a FIFO as a declared dependency'
            exit 1
          fi
          grep -Fq "dependency 'non_regular_dependency.vnt' was not found" "$RUNNER_TEMP/vbuild-fifo-dependency.log"
          mv "$RUNNER_TEMP/vbuild-build-before-fifo.vbuild" build.vbuild
          rm libs/non_regular_dependency.vnt
          # The configured root source must also be a regular file.
          mkfifo src/non_regular_source.vnt
          cp vbuild.properties "$RUNNER_TEMP/vbuild-properties-before-fifo.vbuild"
          sed -i 's|^source = src/main.vnt$|source = src/non_regular_source.vnt|' vbuild.properties
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-fifo-source.log" 2>&1; then
            echo 'VBuild accepted a FIFO as the configured root source'
            exit 1
          fi
          grep -Fq 'source is not a readable regular file' "$RUNNER_TEMP/vbuild-fifo-source.log"
          mv "$RUNNER_TEMP/vbuild-properties-before-fifo.vbuild" vbuild.properties
          rm src/non_regular_source.vnt
          # Fingerprinting must reject special files instead of blocking on a FIFO.
          runtime_source="$GITHUB_WORKSPACE/src/compiler/native_runtime.c"
          mv "$runtime_source" "$runtime_source.vbuild-fingerprint-backup"
          mkfifo "$runtime_source"
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-fifo-fingerprint.log" 2>&1; then
            echo 'VBuild accepted a FIFO as a fingerprint input'
            exit 1
          fi
          mv "$runtime_source.vbuild-fingerprint-backup" "$runtime_source"
          grep -Fq 'fingerprint input is not a readable regular file' "$RUNNER_TEMP/vbuild-fifo-fingerprint.log"
          "$GITHUB_WORKSPACE/vbuild" build
          test -x build/hello
          # PATH-resolved compiler changes must invalidate the cache.
          compiler_tools="$RUNNER_TEMP/vbuild compiler tools"
          mkdir -p "$compiler_tools"
          cat > "$compiler_tools/vnt-cache-wrapper" <<'EOF'
          #!/bin/sh
          if [ "${VBUILD_TEST_FAIL_COMPILER:-}" = "1" ]; then
            : > "$4"
            exit 1
          fi
          if [ "${VBUILD_TEST_INVALID_OUTPUT:-}" = "1" ]; then
            printf 'not an executable\\n' > "$4"
            chmod 644 "$4"
            exit 0
          fi
          exec "$VNT_TEST_REAL_COMPILER" "$@"
          EOF
          export VNT_TEST_REAL_COMPILER="$GITHUB_WORKSPACE/vnt"
          chmod +x "$compiler_tools/vnt-cache-wrapper"
          sed -i 's/^compiler = vnt$/compiler = vnt-cache-wrapper/' vbuild.properties
          export PATH="$compiler_tools:$PATH"
          path_first_build="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\n' "$path_first_build" | grep -Fq 'Built '
          path_cached_build="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\n' "$path_cached_build" | grep -Fq 'Up to date:'
          printf '# changed compiler wrapper identity\n' >> "$compiler_tools/vnt-cache-wrapper"
          path_compiler_rebuild="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\n' "$path_compiler_rebuild" | grep -Fq 'Built '
          # Front-end checking must not require build-only runtime inputs.
          runtime_source="$GITHUB_WORKSPACE/src/compiler/native_runtime.c"
          mv "$runtime_source" "$runtime_source.vbuild-check-hidden"
          if ! "$GITHUB_WORKSPACE/vbuild" check > "$RUNNER_TEMP/vbuild-check-without-runtime.log" 2>&1; then
            mv "$runtime_source.vbuild-check-hidden" "$runtime_source"
            cat "$RUNNER_TEMP/vbuild-check-without-runtime.log"
            exit 1
          fi
          mv "$runtime_source.vbuild-check-hidden" "$runtime_source"
          # A failed compiler must not leave an old manifest authorizing a damaged artifact.
          cp build/hello "$RUNNER_TEMP/vbuild-good-artifact"
          cp src/main.vnt "$RUNNER_TEMP/vbuild-main-backup.vnt"
          printf '\n' >> src/main.vnt
          if VBUILD_TEST_FAIL_COMPILER=1 "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-failed-build.log" 2>&1; then
            echo 'expected injected compiler failure'
            exit 1
          fi
          cmp build/hello "$RUNNER_TEMP/vbuild-good-artifact"
          if compgen -G 'build/hello.vbuild-artifact-*' > /dev/null; then
            echo 'failed compiler left a temporary artifact behind'
            exit 1
          fi
          if VBUILD_TEST_INVALID_OUTPUT=1 "$GITHUB_WORKSPACE/vbuild" build --force > "$RUNNER_TEMP/vbuild-invalid-output.log" 2>&1; then
            echo 'non-executable compiler output was accepted as a successful artifact'
            exit 1
          fi
          if ! grep -Fq 'temporary output is not a usable artifact' "$RUNNER_TEMP/vbuild-invalid-output.log"; then
            cat "$RUNNER_TEMP/vbuild-invalid-output.log"
            exit 1
          fi
          cmp build/hello "$RUNNER_TEMP/vbuild-good-artifact"
          cp "$RUNNER_TEMP/vbuild-main-backup.vnt" src/main.vnt
          recovery_build="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\n' "$recovery_build" | grep -Fq 'Up to date:'
          cmp build/hello "$RUNNER_TEMP/vbuild-good-artifact"
          # -F makes flock exec the holder directly, so its PID is the lock owner.
          rm -f "$RUNNER_TEMP/vbuild-lock-held"
          flock -n -F .vbuild.lock sh -c 'touch "$RUNNER_TEMP/vbuild-lock-held"; exec sleep 60' > "$RUNNER_TEMP/vbuild-lock-holder.log" 2>&1 &
          lock_holder_pid=$!
          trap 'kill "$lock_holder_pid" 2>/dev/null || true; wait "$lock_holder_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            [ -e "$RUNNER_TEMP/vbuild-lock-held" ] && break
            sleep 0.05
          done
          if [ ! -e "$RUNNER_TEMP/vbuild-lock-held" ]; then
            cat "$RUNNER_TEMP/vbuild-lock-holder.log"
            exit 1
          fi
          # A symlinked working-directory alias must resolve to the same lock object.
          project_alias="$RUNNER_TEMP/vbuild-project-alias"
          ln -s "$PWD" "$project_alias"
          if (cd "$project_alias" && "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-lock-alias.log" 2>&1); then
            echo 'project-directory alias bypassed the active lock'
            exit 1
          fi
          if ! grep -Fq 'another VBuild process is using this project' "$RUNNER_TEMP/vbuild-lock-alias.log"; then cat "$RUNNER_TEMP/vbuild-lock-alias.log"; exit 1; fi
          # A check-only task graph is read-only and must not contend for the lock.
          "$GITHUB_WORKSPACE/vbuild" check > "$RUNNER_TEMP/vbuild-lock-check.log" 2>&1 || {
            cat "$RUNNER_TEMP/vbuild-lock-check.log"
            exit 1
          }
          if "$GITHUB_WORKSPACE/vbuild" build > "$RUNNER_TEMP/vbuild-lock-build.log" 2>&1; then
            echo 'concurrent build unexpectedly acquired the project lock'
            exit 1
          fi
          if ! grep -Fq 'another VBuild process is using this project' "$RUNNER_TEMP/vbuild-lock-build.log"; then cat "$RUNNER_TEMP/vbuild-lock-build.log"; cat "$RUNNER_TEMP/vbuild-lock-holder.log"; exit 1; fi
          if "$GITHUB_WORKSPACE/vbuild" clean > "$RUNNER_TEMP/vbuild-lock-clean.log" 2>&1; then
            echo 'clean unexpectedly acquired the project lock during a build'
            exit 1
          fi
          if ! grep -Fq 'another VBuild process is using this project' "$RUNNER_TEMP/vbuild-lock-clean.log"; then cat "$RUNNER_TEMP/vbuild-lock-clean.log"; cat "$RUNNER_TEMP/vbuild-lock-holder.log"; exit 1; fi
          if "$GITHUB_WORKSPACE/vbuild" init > "$RUNNER_TEMP/vbuild-lock-init.log" 2>&1; then
            echo 'init unexpectedly acquired the project lock during another operation'
            exit 1
          fi
          if ! grep -Fq 'another VBuild process is using this project' "$RUNNER_TEMP/vbuild-lock-init.log"; then cat "$RUNNER_TEMP/vbuild-lock-init.log"; exit 1; fi
          # Killing the lock owner must release the OS-managed lock without cleanup code.
          kill "$lock_holder_pid"
          wait "$lock_holder_pid" || true
          trap - EXIT
          released_lock_build="$("$GITHUB_WORKSPACE/vbuild" build --force)"
          printf '%s\n' "$released_lock_build" | grep -Fq 'Built '
          output="$("$GITHUB_WORKSPACE/vbuild" run)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fq '49'
          incremental="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\n' "$incremental" | grep -Fq 'Up to date:'
          sleep 1
          cat > libs/nested/bonus.vnt <<'EOF'
          export fun increment() -> int {
              return 1
          }
          EOF
          transitive_rebuild="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\\n' "$transitive_rebuild" | grep -Fq 'Built '
          output="$("$GITHUB_WORKSPACE/vbuild" run)"
          printf '%s\\n' "$output" | grep -Fq '50'
          sleep 1
          cat > libs/math_helpers.vnt <<'EOF'
          import "nested/bonus.vnt" as bonus
          export fun square(value: int) -> int {
              return value * value + bonus.increment() + 1
          }
          EOF
          dependency_rebuild="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\\n' "$dependency_rebuild" | grep -Fq 'Built '
          output="$("$GITHUB_WORKSPACE/vbuild" run)"
          printf '%s\\n' "$output" | grep -Fq '51'
          sleep 1
          touch "$GITHUB_WORKSPACE/src/compiler/native_runtime.c"
          runtime_rebuild="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\\n' "$runtime_rebuild" | grep -Fq 'Built '
          output="$("$GITHUB_WORKSPACE/vbuild" run)"
          printf '%s\\n' "$output" | grep -Fq '51'
          # Content changes must invalidate the build even when mtime is restored.
          cp -p libs/nested/bonus.vnt "$RUNNER_TEMP/vbuild-bonus-backup.vnt"
          sed -i 's/return 1/return 2/' libs/nested/bonus.vnt
          touch -r "$RUNNER_TEMP/vbuild-bonus-backup.vnt" libs/nested/bonus.vnt
          same_mtime_rebuild="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\n' "$same_mtime_rebuild" | grep -Fq 'Built '
          output="$("$GITHUB_WORKSPACE/vbuild" run)"
          printf '%s\n' "$output" | grep -Fq '52'
          forced="$("$GITHUB_WORKSPACE/vbuild" build --force)"
          printf '%s\n' "$forced" | grep -Fq 'Built '
          mkdir -p tests
          printf 'print("VBUILD_TEST_OK")\n' > tests/smoke.vnt
          test_output="$("$GITHUB_WORKSPACE/vbuild" test)"
          printf '%s\n' "$test_output"
          printf '%s\n' "$test_output" | grep -Fq 'VBUILD_TEST_OK'
      - name: Build a freestanding ELF through VBuild
        shell: bash
        run: |
          project="$RUNNER_TEMP/vbuild elf integration project"
          mkdir -p "$project"
          cd "$project"
          "$GITHUB_WORKSPACE/vbuild" init
          cp "$GITHUB_WORKSPACE/tests/freestanding_minimal.vnt" src/main.vnt
          cat > vbuild.properties <<EOF
          project.name = kernel
          project.version = 0.1.0
          source = src/main.vnt
          output = kernel
          compiler = vnt
          toolchain = $GITHUB_WORKSPACE
          EOF
          sed -i 's/^target exe$/target elf/' build.vbuild
          "$GITHUB_WORKSPACE/vbuild" build
          test -x build/kernel.elf
          readelf -h build/kernel.elf | grep -Fq 'ELF64'
          sleep 1
          touch "$GITHUB_WORKSPACE/freestanding/x86_64.ld"
          linker_rebuild="$("$GITHUB_WORKSPACE/vbuild" build)"
          printf '%s\\n' "$linker_rebuild" | grep -Fq 'Built '
          test -x build/kernel.elf
          readelf -h build/kernel.elf | grep -Fq 'ELF64'