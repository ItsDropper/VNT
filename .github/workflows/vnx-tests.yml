name: VNX VNT-Native Interpreter Tests

on:
  push:
    branches: [main, feature/vnx-language-and-adventure, fix/vnx-ci-errors-and-routes]
    paths: ["vnx/**", "src/**", "include/**", "tests/**", ".github/workflows/vnx-tests.yml"]
  pull_request:
    paths: ["vnx/**", "src/**", "include/**", "tests/**", ".github/workflows/vnx-tests.yml"]

permissions:
  contents: read

jobs:
  vnx-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build VNT compiler from source
        run: |
          gcc -O2 -Iinclude -Isrc/compiler \
            src/main.c src/modules.c src/lexer.c \
            src/parser/parser.c src/parser/primary.c src/parser/unary.c \
            src/parser/binary.c src/parser/functions.c src/parser/statements.c \
            src/parser/simple_statements.c src/parser/control.c src/parser/loops.c \
            src/parser/assignments.c src/ast.c src/compiler/compiler.c \
            src/compiler/typecheck.c src/compiler/ir.c src/compiler/ir_lower.c \
            src/compiler/cfg.c src/compiler/x86_backend.c src/compiler/freestanding_x86.c \
            -o vnt
      - name: Compile VNT-native interpreter
        run: |
          mkdir -p vnx/build
          ./vnt --compile vnx/interpreter.vnt -o vnx/build/vnx
      - name: Verify VNT string indexing types correctly
        run: |
          ./vnt --compile tests/native_types.vnt -o vnx/build/native-types
          vnx/build/native-types > vnx/build/native-types.out
          grep -F 'Vanta' vnx/build/native-types.out
      - name: Run VNX smoke tests and full adventure routes
        run: sh vnx/tests/smoke.sh vnx/build/vnx
